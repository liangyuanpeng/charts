apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-{{ .Values.postgresql.service.name | default "pgsql"  }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: pgsql
spec:
  ports:
    - port: 5432
      name: pgsql
{{ if eq .Values.postgresql.service.type "NodePort" }}
      nodePort: {{ .Values.postgresql.service.nodePort  }}
{{ end }}
  type: {{ .Values.postgresql.service.type }}
  selector:
    app: pgsql
