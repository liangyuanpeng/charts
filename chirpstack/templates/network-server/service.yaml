apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.networkserver.service.name | default "chirpstack-ns"  }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: chirpstack-ns
    {{- include "chirpstack.matchLabels" . | nindent 4 }}
spec:
  ports:
    - port: 8000
      name: chirpstack-ns
{{ if eq .Values.networkserver.service.type "NodePort" }}
      nodePort: {{ .Values.networkserver.service.nodePort  }}
{{ end }}
  type: {{ .Values.networkserver.service.type  }}
  selector:
    app: chirpstack-ns
    # {{- include "chirpstack.matchLabels" . | nindent 4 }}
